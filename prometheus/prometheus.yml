global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: contract-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:3000"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
